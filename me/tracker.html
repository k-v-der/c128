<title>مالي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column. Two money cards, a goods list, recent events. One fixed button opens a step-by-step wizard. */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --fg: #17201c;
  --muted: #64716b;
  --line: #dfe4e1;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --usdt: #2f6f8f;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #182019; --fg: #e6ece9; --muted: #98a6a0; --line: #29332f;
    --accent: #5cc4ae; --accent-ink: #101513; --usdt: #79b8d6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #182019; --fg: #e6ece9; --muted: #98a6a0; --line: #29332f;
  --accent: #5cc4ae; --accent-ink: #101513; --usdt: #79b8d6; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
h1 { font-size: 1.3rem; margin: 0; }
h2 { font-size: 0.95rem; margin: 0; color: var(--muted); font-weight: 600; }
p { margin: 0; }
.status { color: var(--muted); font-size: 0.78rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; min-width: 0; }
.big { font-family: var(--font-num); font-size: 2.2rem; font-weight: 500; line-height: 1.15; direction: ltr; unicode-bidi: isolate; text-align: right; }
.usdt .big { color: var(--usdt); }
.rows { display: grid; gap: 4px; }
.r { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; color: var(--muted); }
.r .v { font-family: var(--font-num); direction: ltr; unicode-bidi: isolate; color: var(--fg); white-space: nowrap; }
.goods { display: grid; }
.g { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.g:last-child { border-bottom: none; }
.g .n { flex: 1; min-width: 0; }
.g .c { font-family: var(--font-num); font-size: 1.15rem; direction: ltr; unicode-bidi: isolate; }
.g.zero .n, .g.zero .c { color: var(--muted); }
button {
  font: inherit; font-weight: 600; font-size: 0.92rem; border-radius: 10px; padding: 10px 14px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
button.soft { background: transparent; color: var(--muted); border-color: var(--line); font-size: 0.78rem; padding: 4px 10px; font-weight: 500; }
button.link { background: transparent; border: none; color: var(--accent); padding: 4px 6px; font-size: 0.85rem; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; list-style: none; padding-top: 4px; }
details > summary::-webkit-details-marker { display: none; }
.log { display: grid; gap: 6px; font-size: 0.86rem; }
.log .e { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.log .e span { min-width: 0; }
.log .t { color: var(--muted); font-size: 0.75rem; }
.fab {
  position: fixed; inset: auto 0 0 0; z-index: 20; display: flex; justify-content: center;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.fab button { width: 100%; max-width: 560px; font-size: 1.1rem; padding: 15px; border-radius: 14px; }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px;
}
.sheet h3 { margin: 0; font-size: 1.2rem; text-wrap: balance; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts button { background: var(--bg); color: var(--fg); border-color: var(--line); padding: 14px 8px; font-size: 0.95rem; }
.opts button.full { grid-column: 1 / -1; }
.sheet input { font: inherit; font-size: 1.4rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; }
.sheet input[type="number"] { font-family: var(--font-num); direction: ltr; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { background: var(--bg); color: var(--fg); border-color: var(--line); padding: 6px 12px; font-size: 0.85rem; font-weight: 500; }
.top { display: flex; justify-content: space-between; align-items: center; }
.done { text-align: center; display: grid; gap: 10px; padding-block: 10px; }
@media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } button:hover { opacity: .88; } }
</style>

<main dir="rtl" lang="ar">
  <header>
    <h1>مالي</h1>
    <p class="status" id="status">جارٍ التحميل…</p>
  </header>

  <section class="card" aria-labelledby="h-da">
    <h2 id="h-da">💵 مالك بالدينار</h2>
    <div class="big" id="daTotal">–</div>
    <div class="rows" id="daRows"></div>
  </section>

  <section class="card usdt" aria-labelledby="h-usdt">
    <h2 id="h-usdt">💲 USDT</h2>
    <div class="big" id="usdtTotal">–</div>
    <div class="rows" id="usdtRows"></div>
  </section>

  <section class="card" aria-labelledby="h-goods">
    <h2 id="h-goods">📦 سلعتك</h2>
    <div class="goods" id="goods"></div>
    <details id="boxWrap" hidden>
      <summary id="boxSum"></summary>
      <div class="goods" id="box"></div>
    </details>
  </section>

  <section class="card" aria-labelledby="h-log">
    <h2 id="h-log">آخر ما حدث</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<div class="fab" dir="rtl" lang="ar"><button type="button" id="go">ماذا حدث؟</button></div>
<div id="sheetRoot"></div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const da = (n) => Math.round(n).toLocaleString("en-US") + " دج";
  const ut = (n) => (Math.round(n * 100) / 100).toLocaleString("en-US") + " USDT";
  const ACC = { cash: "كاش", ccp: "CCP", dhd: "عند dhd", bybit: "Bybit" };

  let ST = { cash: 0, ccp: 0, dhd: 0, bybit: 0, debts: [] };
  let ITEMS = [];
  let LOG = [];

  // ---------- storage ----------
  let db = null;
  const LS = "mali-v1";
  const setStatus = (t) => { $("status").textContent = t; };
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify({ ST, ITEMS, LOG })); } catch (e) {} }
  function lsLoad() { try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s) { ST = s.ST; ITEMS = s.ITEMS; LOG = s.LOG; } } catch (e) {} }
  async function write(fn) { if (!db) { lsSave(); return; } try { await fn(); } catch (e) { setStatus("تعذّر الحفظ. حاول مرة أخرى."); } }
  const saveState = () => write(() => db.doc("state/main").set(clone(ST)));
  const saveItem = (it) => write(() => { const d = clone(it); delete d.id; return db.collection("items").doc(it.id).set(d); });
  const delItem = (id) => write(() => db.collection("items").doc(id).delete());
  const saveLog = (l) => write(() => { const d = clone(l); delete d.id; return db.collection("log").doc(l.id).set(d); });
  const delLog = (id) => write(() => db.collection("log").doc(id).delete());

  async function init() {
    if (!window.claude || !window.claude.use) { lsLoad(); render(); setStatus("محفوظ على هذا الجهاز فقط."); return; }
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { lsLoad(); render(); setStatus("محفوظ على هذا الجهاز فقط."); return; }
    let got = 0;
    const timer = setTimeout(() => { if (got < 3) setStatus("لا يمكن الوصول إلى بياناتك بعد. تحقق من الاتصال."); }, 10000);
    const mark = (snap) => { if (!snap.metadata.fromCache && ++got >= 3) { clearTimeout(timer); setStatus("محفوظ في حسابك. لا يراه أحد غيرك."); } };
    const onErr = () => { clearTimeout(timer); setStatus("انقطع الاتصال. أعد فتح الصفحة."); };
    db.doc("state/main").onSnapshot((s) => { ST = Object.assign({ cash: 0, ccp: 0, dhd: 0, bybit: 0, debts: [] }, s.exists ? s.data() : {}); mark(s); render(); }, onErr);
    db.collection("items").onSnapshot((s) => { ITEMS = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); mark(s); render(); }, onErr);
    db.collection("log").orderBy("ts", "desc").limit(8).onSnapshot((s) => { LOG = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); mark(s); render(); }, onErr);
  }

  // ---------- apply with undo ----------
  // Runs a change, then saves the state, the touched items and a log line holding what was there before.
  function apply(text, fn) {
    const before = { state: clone(ST), items: [] };
    const touched = new Map();
    const touch = (it) => { if (!touched.has(it.id)) { touched.set(it.id, it); const old = ITEMS.find((x) => x.id === it.id); before.items.push(old ? clone(old) : { id: it.id, __new: true }); } return it; };
    fn(touch);
    touched.forEach((it) => { if (!ITEMS.includes(it)) ITEMS.push(it); saveItem(it); });
    const l = { id: uid(), ts: new Date().toISOString(), text, before };
    LOG = [l].concat(LOG).slice(0, 8);
    saveState(); saveLog(l); render();
  }
  function undo(l) {
    ST = clone(l.before.state); saveState();
    (l.before.items || []).forEach((old) => {
      if (old.__new) { ITEMS = ITEMS.filter((x) => x.id !== old.id); delItem(old.id); }
      else { const i = ITEMS.findIndex((x) => x.id === old.id); if (i >= 0) ITEMS[i] = old; else ITEMS.push(old); saveItem(old); }
    });
    LOG = LOG.filter((x) => x.id !== l.id); delLog(l.id); render();
  }

  // ---------- render ----------
  function row(box, label, value) { const r = el("div", "r"); r.append(el("span", "", label), el("span", "v", value)); box.append(r); }
  function render() {
    const daT = num(ST.cash) + num(ST.ccp) + num(ST.dhd);
    $("daTotal").textContent = da(daT);
    const dr = $("daRows"); dr.replaceChildren();
    row(dr, "كاش", da(num(ST.cash))); if (num(ST.ccp)) row(dr, "CCP", da(num(ST.ccp))); row(dr, "عند dhd", da(num(ST.dhd)));
    const debts = (ST.debts || []).filter((d) => Math.abs(num(d.amount)) > 0.004);
    const theyDA = debts.filter((d) => d.cur === "DA" && d.amount > 0), meDA = debts.filter((d) => d.cur === "DA" && d.amount < 0);
    if (theyDA.length) row(dr, "لك عند الناس (غير محسوب فوق): " + theyDA.map((d) => d.name).join("، "), da(theyDA.reduce((t, d) => t + d.amount, 0)));
    if (meDA.length) row(dr, "عليك: " + meDA.map((d) => d.name).join("، "), da(-meDA.reduce((t, d) => t + d.amount, 0)));

    $("usdtTotal").textContent = ut(num(ST.bybit));
    const ur = $("usdtRows"); ur.replaceChildren();
    row(ur, "في Bybit", ut(num(ST.bybit)));
    debts.filter((d) => d.cur === "USDT" && d.amount > 0).forEach((d) => row(ur, "عند " + d.name, ut(d.amount)));
    debts.filter((d) => d.cur === "USDT" && d.amount < 0).forEach((d) => row(ur, "عليك لـ " + d.name, ut(-d.amount)));

    const vis = ITEMS.filter((i) => !i.hidden).sort((a, b) => num(b.qty) - num(a.qty));
    const hid = ITEMS.filter((i) => i.hidden);
    const g = $("goods"); g.replaceChildren();
    if (!vis.length) g.append(el("p", "status", hid.length ? "كل منتجاتك في الصندوق." : "لا توجد سلعة بعد."));
    vis.forEach((it) => g.append(goodRow(it, "إخفاء", () => { it.hidden = true; saveItem(it); render(); })));
    $("boxWrap").hidden = !hid.length;
    $("boxSum").textContent = "الصندوق: " + hid.length + " منتج مخفي";
    const bx = $("box"); bx.replaceChildren();
    hid.forEach((it) => bx.append(goodRow(it, "أرجِعه", () => { it.hidden = false; saveItem(it); render(); })));

    const lg = $("log"); lg.replaceChildren();
    if (!LOG.length) lg.append(el("p", "status", "لا شيء بعد. اضغط \"ماذا حدث؟\" في الأسفل."));
    LOG.forEach((l, i) => {
      const e = el("div", "e"); const s = el("span"); s.append(el("span", "", l.text + " "), el("span", "t", (l.ts || "").slice(0, 10)));
      e.append(s);
      if (i === 0) { const u = el("button", "link", "تراجع"); u.type = "button"; u.onclick = () => undo(l); e.append(u); }
      lg.append(e);
    });
  }
  function goodRow(it, label, fn) {
    const r = el("div", "g" + (num(it.qty) <= 0 ? " zero" : ""));
    r.append(el("span", "n", it.name), el("span", "c", String(Math.round(num(it.qty)))));
    const b = el("button", "soft", label); b.type = "button"; b.setAttribute("aria-label", label + " " + it.name); b.onclick = fn; r.append(b);
    return r;
  }

  // ---------- wizard ----------
  const W = { stack: [] };
  function sheet(build) {
    const root = $("sheetRoot"); root.replaceChildren();
    const bg = el("div", "sheet-bg"); const sh = el("div", "sheet"); sh.dir = "rtl"; sh.lang = "ar";
    sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
    const top = el("div", "top");
    const back = el("button", "link", "→ رجوع"); back.type = "button"; back.hidden = W.stack.length <= 1;
    back.onclick = () => { W.stack.pop(); W.stack[W.stack.length - 1](); };
    const x = el("button", "link", "إغلاق"); x.type = "button"; x.onclick = close;
    top.append(back, x); sh.append(top);
    build(sh);
    bg.onclick = (e) => { if (e.target === bg) close(); };
    bg.append(sh); root.append(bg);
    const f = sh.querySelector("input, .opts button"); if (f) f.focus();
  }
  function close() { W.stack = []; $("sheetRoot").replaceChildren(); }
  function step(fn) { W.stack.push(fn); fn(); }
  function ask(q, opts, cb) {
    step(() => sheet((sh) => {
      sh.append(el("h3", "", q)); const o = el("div", "opts");
      opts.forEach(([label, v], i) => { const b = el("button", opts.length % 2 && i === opts.length - 1 ? "full" : "", label); b.type = "button"; b.onclick = () => cb(v); o.append(b); });
      sh.append(o);
    }));
  }
  function askNum(q, cb, def) {
    step(() => sheet((sh) => {
      sh.append(el("h3", "", q));
      const i = el("input"); i.type = "number"; i.inputMode = "decimal"; i.min = "0"; i.step = "any"; i.id = "w-num"; if (def) i.value = def;
      const ok = el("button", "", "التالي"); ok.type = "button";
      const go = () => { const v = num(i.value); if (v > 0 || (def !== undefined && i.value !== "")) cb(v); else i.focus(); };
      ok.onclick = go; i.onkeydown = (e) => { if (e.key === "Enter") go(); };
      sh.append(i, ok);
    }));
  }
  function askText(q, chips, cb) {
    step(() => sheet((sh) => {
      sh.append(el("h3", "", q));
      if (chips.length) { const c = el("div", "chips"); chips.forEach((t) => { const b = el("button", "", t); b.type = "button"; b.onclick = () => cb(t); c.append(b); }); sh.append(c); }
      const i = el("input"); i.type = "text"; i.id = "w-text";
      const ok = el("button", "", "التالي"); ok.type = "button";
      const go = () => { const v = i.value.trim(); if (v) cb(v); else i.focus(); };
      ok.onclick = go; i.onkeydown = (e) => { if (e.key === "Enter") go(); };
      sh.append(i, ok);
    }));
  }
  function finish(text, fn) {
    apply(text, fn);
    W.stack = [];
    sheet((sh) => {
      const d = el("div", "done"); d.append(el("h3", "", "تم ✓"), el("p", "", text));
      const ok = el("button", "", "تمام"); ok.type = "button"; ok.onclick = close; d.append(ok); sh.append(d);
    });
  }
  const accOpts = (keys) => keys.map((k) => [ACC[k], k]);
  function pickItem(cb, allowNew) {
    const vis = ITEMS.filter((i) => !i.hidden), hid = ITEMS.filter((i) => i.hidden);
    const opts = vis.map((i) => [i.name + " (" + Math.round(num(i.qty)) + ")", i.id]).concat(hid.map((i) => [i.name + " · مخفي", i.id]));
    if (allowNew) opts.push(["+ منتج جديد", "__new"]);
    ask("أي منتج؟", opts, (id) => {
      if (id === "__new") askText("اسم المنتج الجديد؟", [], (name) => cb({ id: uid(), name, qty: 0, cost: 0, hidden: false }));
      else cb(ITEMS.find((i) => i.id === id));
    });
  }
  function debtFlow(cur) {
    const names = [...new Set((ST.debts || []).filter((d) => d.cur === cur && Math.abs(d.amount) > 0.004).map((d) => d.name))];
    askText("مع من؟", names, (who) => ask("ماذا حدث مع " + who + "؟", [["أعطيته (صار مديناً لي)", "lend"], ["أخذت منه (صرت مديناً له)", "borrow"], ["ردّ لي", "repaid"], ["رددت له", "repay"]], (kind) =>
      askNum("كم؟" + (cur === "USDT" ? " (USDT)" : " (دج)"), (a) =>
        ask(kind === "lend" || kind === "repay" ? "من أين خرج المال؟" : "أين دخل المال؟", cur === "USDT" ? [["Bybit", "bybit"], ["لم يتحرك مال", "none"]] : accOpts(["cash", "ccp"]).concat([["لم يتحرك مال", "none"]]), (k) => {
          const sign = kind === "lend" || kind === "repay" ? 1 : -1; // + means they owe me more
          const unit = cur === "USDT" ? ut : da;
          const txt = { lend: "أعطيت " + who, borrow: "أخذت من " + who, repaid: who + " ردّ لي", repay: "رددت لـ " + who }[kind] + " " + unit(a);
          finish(txt, () => {
            ST.debts = ST.debts || [];
            let d = ST.debts.find((x) => x.name === who && x.cur === cur);
            if (!d) { d = { name: who, cur, amount: 0 }; ST.debts.push(d); }
            d.amount = Math.round((num(d.amount) + sign * a) * 100) / 100;
            ST.debts = ST.debts.filter((x) => Math.abs(x.amount) > 0.004);
            if (k !== "none") ST[k] = num(ST[k]) - sign * a;
          });
        }))));
  }

  const FLOWS = {
    root: () => ask("ماذا حدث؟", [["💵 مال بالدينار", "money"], ["📦 سلعة", "goods"], ["💲 USDT", "usdt"], ["✏️ تصحيح رقم", "fix"]], (v) => FLOWS[v]()),
    money: () => ask("ماذا حدث للمال؟", [["صرفت مالاً", "spent"], ["دخلني مال", "in"], ["dhd حوّلت لي", "payout"], ["دين بالدينار", "debt"]], (v) => FLOWS[v]()),
    spent: () => askNum("كم صرفت؟ (دج)", (a) => ask("من أين؟", accOpts(["cash", "ccp"]), (k) => finish("صرفت " + da(a) + " من " + ACC[k], () => { ST[k] = num(ST[k]) - a; }))),
    in: () => askNum("كم دخلك؟ (دج)", (a) => ask("أين وضعته؟", accOpts(["cash", "ccp"]), (k) => finish("دخلني " + da(a) + " إلى " + ACC[k], () => { ST[k] = num(ST[k]) + a; }))),
    payout: () => askNum("كم حوّلت لك dhd؟ (دج)", (a) => ask("إلى أين؟", accOpts(["cash", "ccp"]), (k) => finish("dhd حوّلت " + da(a) + " إلى " + ACC[k], () => { ST.dhd = num(ST.dhd) - a; ST[k] = num(ST[k]) + a; }))),
    debt: () => debtFlow("DA"),
    goods: () => ask("ماذا حدث للسلعة؟", [["بِعت (تسلّم الزبون)", "sold"], ["اشتريت سلعة", "bought"], ["ضاعت / تالفة", "lost"]], (v) => FLOWS[v]()),
    sold: () => pickItem((it) => askNum("كم قطعة تسلّمها الزبون؟", (n) => askNum("كم ستعطيك dhd عنها؟ (المجموع بالدينار)", (a) =>
      finish("بِعت " + n + " " + it.name + " · +" + da(a) + " عند dhd", (touch) => { touch(it).qty = num(it.qty) - n; ST.dhd = num(ST.dhd) + a; })))),
    bought: () => pickItem((it) => askNum("كم قطعة؟", (n) => askNum("بكم القطعة؟ (دج)", (p) => ask("دفعت من أين؟", accOpts(["cash", "ccp"]).concat([["لم أدفع من مالي", "none"]]), (k) =>
      finish("اشتريت " + n + " " + it.name + " × " + da(p), (touch) => { const t = touch(it); t.qty = num(t.qty) + n; t.cost = p; if (k !== "none") ST[k] = num(ST[k]) - n * p; })), it.cost || undefined)), true),
    lost: () => pickItem((it) => askNum("كم قطعة؟", (n) => finish(n + " " + it.name + " ضاعت أو تالفة", (touch) => { touch(it).qty = num(it.qty) - n; }))),
    usdt: () => ask("ماذا حدث للـ USDT؟", [["اشتريت USDT", "buy"], ["صرفت إعلانات", "ads"], ["دين USDT", "udebt"]], (v) => FLOWS[v]()),
    buy: () => askNum("كم دينار دفعت؟", (d) => ask("من أين؟", accOpts(["cash", "ccp"]), (k) => askNum("كم USDT وصلك؟", (u) =>
      finish("اشتريت " + ut(u) + " بـ " + da(d), () => { ST[k] = num(ST[k]) - d; ST.bybit = num(ST.bybit) + u; })))),
    ads: () => askNum("كم USDT صرفت على الإعلانات؟", (u) => finish("إعلانات " + ut(u), () => { ST.bybit = num(ST.bybit) - u; })),
    udebt: () => debtFlow("USDT"),
    fix: () => ask("أي رقم تريد تصحيحه؟", [["كاش", "cash"], ["CCP", "ccp"], ["عند dhd", "dhd"], ["Bybit", "bybit"], ["عدد قطع منتج", "item"]], (k) => {
      if (k === "item") pickItem((it) => askNum("كم قطعة " + it.name + " عندك الآن؟", (n) => finish("صحّحت " + it.name + " إلى " + n, (touch) => { touch(it).qty = n; }), String(Math.round(num(it.qty)))), true);
      else askNum("كم " + ACC[k] + " الآن بالضبط؟", (v) => finish("صحّحت " + ACC[k] + " إلى " + (k === "bybit" ? ut(v) : da(v)), () => { ST[k] = v; }), String(num(ST[k])));
    })
  };

  $("go").onclick = () => { W.stack = []; FLOWS.root(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  render(); init();
})();
</script>
