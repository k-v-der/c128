<title>دفتر المال والمتجر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first ledger. One column, four screens behind a bottom tab bar; forms open as a bottom sheet. */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --fg: #15201c;
  --muted: #5b6b65;
  --line: #dbe2df;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --good: #1b7a45; --good-bg: #e2f3e9;
  --bad: #b3261e; --bad-bg: #fbe7e5;
  --warn: #8a5a00; --warn-bg: #fbf0d9;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #18201d; --fg: #e5ece9; --muted: #95a59f; --line: #2a3531;
    --accent: #5cc4ae; --accent-ink: #0f1513;
    --good: #5fcf8f; --good-bg: #15301f; --bad: #ff8a80; --bad-bg: #3a1a18; --warn: #f0c060; --warn-bg: #352a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #18201d; --fg: #e5ece9; --muted: #95a59f; --line: #2a3531;
  --accent: #5cc4ae; --accent-ink: #0f1513;
  --good: #5fcf8f; --good-bg: #15301f; --bad: #ff8a80; --bad-bg: #3a1a18; --warn: #f0c060; --warn-bg: #352a12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 720px; margin: 0 auto; padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
h1 { font-size: 1.35rem; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; text-wrap: balance; }
h3 { font-size: 0.95rem; margin: 0; }
p { margin: 0; }
.sub { color: var(--muted); font-size: 0.88rem; }
.status { color: var(--muted); font-size: 0.78rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.big { font-family: var(--font-num); font-size: 1.9rem; font-weight: 500; direction: ltr; unicode-bidi: isolate; line-height: 1.2; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 2px; }
.tile .l { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.tile .v { font-family: var(--font-num); font-size: 1.15rem; direction: ltr; unicode-bidi: isolate; text-align: right; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.over > i { background: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; color: var(--fg); }
button.chip { cursor: pointer; font: inherit; font-size: 0.8rem; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.good { background: var(--good-bg); color: var(--good); }
.bad { background: var(--bad-bg); color: var(--bad); }
.warn { background: var(--warn-bg); color: var(--warn); }
.none { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
button {
  font: inherit; font-weight: 600; font-size: 0.9rem; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
button.ghost { background: transparent; color: var(--accent); }
button.plain { background: transparent; border-color: var(--line); color: var(--fg); }
button.x { background: transparent; border: none; color: var(--muted); padding: 2px 8px; font-size: 1.1rem; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick button { background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding: 10px 4px; font-size: 0.8rem; font-weight: 600; }
@media (max-width: 380px) { .quick { grid-template-columns: repeat(2, 1fr); } }
input, select, textarea {
  font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input[type="number"] { font-family: var(--font-num); direction: ltr; text-align: right; }
label.f { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.list { display: grid; }
.li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: none; }
.li .d { min-width: 0; display: grid; gap: 1px; }
.li .t { font-size: 0.9rem; }
.li .m { font-size: 0.75rem; color: var(--muted); }
.li .a { font-family: var(--font-num); direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-size: 0.9rem; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 0.86rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-num); direction: ltr; unicode-bidi: isolate; text-align: left; }
.kv .tot { font-weight: 600; color: var(--fg); border-top: 1px solid var(--line); padding-top: 5px; }
.empty { color: var(--muted); font-size: 0.88rem; }
.ask { border: 1px dashed var(--accent); background: var(--surface); }
.preview .li { gap: 8px; }
details > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.85rem; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
nav.tabs {
  position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabs a { text-align: center; text-decoration: none; color: var(--muted); font-size: 0.8rem; font-weight: 600; padding: 8px 2px; border-radius: 8px; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--bg); }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px;
}
@media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } button:hover:not(:disabled) { opacity: .88; } }
</style>

<main dir="rtl" lang="ar" id="app">
  <header class="row between">
    <div>
      <h1>دفتر المال والمتجر</h1>
      <p class="status" id="status">جارٍ التحميل…</p>
    </div>
  </header>

  <!-- TODAY -->
  <section id="v-today" class="stack" aria-label="اليوم">
    <div class="card" id="weekCard"></div>

    <div class="card" id="smartCard">
      <h2>ماذا حدث؟</h2>
      <p class="sub">اكتب كما تتكلم، وأنا أرتّبه وأحسبه. يمكنك كتابة عدة أشياء في رسالة واحدة.</p>
      <textarea id="smartText" placeholder="مثلاً: فليكسي 200، وكلت 450، اشتريت 30 دولار بـ 7500 من CCP"></textarea>
      <div class="chips" id="smartEx"></div>
      <div class="row"><button type="button" id="smartGo">سجّل</button><span class="status" id="smartMsg"></span></div>
      <div id="smartOut"></div>
    </div>

    <div class="card">
      <h2>تسجيل سريع</h2>
      <div class="quick" id="quick"></div>
    </div>

    <div class="card ask" id="checkin"></div>

    <div class="card">
      <div class="row between"><h2>اليوم</h2><span class="n sub" id="todayDate"></span></div>
      <div class="list" id="todayList"></div>
    </div>
  </section>

  <!-- STORE -->
  <section id="v-store" class="stack" aria-label="المتجر" hidden>
    <div class="tiles" id="storeTiles"></div>
    <div class="row between"><h2>كتالوج المنتجات</h2><button type="button" class="ghost" id="addProduct">+ منتج</button></div>
    <div class="stack" id="catalog"></div>
  </section>

  <!-- CAMPAIGNS -->
  <section id="v-camps" class="stack" aria-label="الحملات" hidden>
    <div class="row between"><h2>الحملات</h2><button type="button" class="ghost" id="addCampaign">+ حملة جديدة</button></div>
    <div class="stack" id="campList"></div>
  </section>

  <!-- MONEY -->
  <section id="v-money" class="stack" aria-label="المال" hidden>
    <div class="card" id="netCard"></div>
    <div class="card"><h2>مصادر المال</h2><div class="list" id="acctList"></div></div>
    <div class="card"><h2>الديون</h2><div id="debtBox"></div></div>
    <div class="card"><h2>كل العمليات</h2><div class="list" id="allList"></div></div>
    <div class="card">
      <h2>الإعدادات</h2>
      <div class="fgrid">
        <label class="f">مصروف الأسبوع (دج)<input type="number" id="s-weekly" min="0"></label>
        <label class="f">سعر الدولار (دج لكل 1$)<input type="number" id="s-rate" min="0"></label>
        <label class="f">رسوم المرتجع (دج)<input type="number" id="s-ret" min="0"></label>
      </div>
      <p class="sub">رصيد البداية لكل مصدر (كم كان عندك قبل أن تبدأ التسجيل):</p>
      <div class="fgrid" id="openGrid"></div>
      <div class="row"><button type="button" id="saveSettings">احفظ الإعدادات</button><span class="status" id="setMsg"></span></div>
    </div>
  </section>
</main>

<nav class="tabs" dir="rtl" lang="ar" aria-label="الأقسام">
  <a href="#today" data-v="today">اليوم</a>
  <a href="#store" data-v="store">المتجر</a>
  <a href="#campaigns" data-v="camps">الحملات</a>
  <a href="#money" data-v="money">المال</a>
</nav>

<div id="sheetRoot"></div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
  const today = () => new Date().toLocaleDateString("en-CA");
  const fmt = (n) => Math.round(n).toLocaleString("en-US") + " دج";
  const usd = (n) => "$" + (Math.round(n * 100) / 100).toLocaleString("en-US");

  const ACCTS = {
    cash: { n: "الكاش", cur: "DZD" },
    ccp: { n: "CCP / بريدي موب", cur: "DZD" },
    delivery: { n: "عند شركة التوصيل", cur: "DZD" },
    bybit: { n: "Bybit (USDT)", cur: "USD" }
  };
  const CATS = {
    food: { n: "أكل", living: true }, transport: { n: "نقل", living: true }, bills: { n: "فواتير", living: true },
    flexy: { n: "فليكسي", living: true }, living_other: { n: "معيشة أخرى", living: true },
    shipping: { n: "Yassir / نقل الطرود", living: false }, packaging: { n: "تغليف", living: false }, store_other: { n: "مصاريف متجر أخرى", living: false }
  };
  const DEF = { weekly: 7500, usdRate: 0, returnFee: 50, open: { cash: 0, ccp: 0, delivery: 0, bybit: 0 } };
  const S = { entries: [], products: [], campaigns: [], settings: JSON.parse(JSON.stringify(DEF)) };

  // ---------------- storage ----------------
  let db = null, sample = null;
  const LS = "money-book-v1";
  function setStatus(t) { $("status").textContent = t; }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
  function lsLoad() { try { const s = localStorage.getItem(LS); if (s) Object.assign(S, JSON.parse(s)); } catch (e) {} }
  async function put(col, obj) {
    if (!obj.id) obj.id = uid();
    if (col === "settings") { S.settings = obj; } else {
      const arr = S[col]; const i = arr.findIndex((x) => x.id === obj.id);
      if (i >= 0) arr[i] = obj; else arr.push(obj);
    }
    render();
    if (db) {
      try { const data = Object.assign({}, obj); delete data.id; await db.collection(col).doc(obj.id).set(data); }
      catch (e) { setStatus(e && e.code === "quota_exceeded" ? "المساحة ممتلئة. احذف عمليات قديمة." : "تعذّر الحفظ. حاول مرة أخرى."); }
    } else lsSave();
  }
  async function del(col, id) {
    S[col] = S[col].filter((x) => x.id !== id); render();
    if (db) { try { await db.collection(col).doc(id).delete(); } catch (e) { setStatus("تعذّر الحذف."); } } else lsSave();
  }
  async function initStore() {
    if (!window.claude || !window.claude.use) { lsLoad(); render(); setStatus("محفوظ على هذا الجهاز فقط."); return; }
    window.claude.use("sample").then((s) => { sample = s; renderSmartAvail(); }).catch(() => { sample = null; renderSmartAvail(); });
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { lsLoad(); render(); setStatus("محفوظ على هذا الجهاز فقط."); return; }
    let got = 0; const need = 4;
    const timer = setTimeout(() => { if (got < need) setStatus("لا يمكن الوصول إلى بياناتك بعد. تحقق من الاتصال."); }, 10000);
    const mark = (snap) => { if (!snap.metadata.fromCache) { got++; if (got >= need) { clearTimeout(timer); setStatus("محفوظ في حسابك. لا يراه أحد غيرك."); } } };
    const onErr = () => { clearTimeout(timer); setStatus("انقطع الاتصال بالبيانات. أعد فتح الصفحة."); };
    ["entries", "products", "campaigns"].forEach((col) => {
      db.collection(col).onSnapshot((snap) => { S[col] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); mark(snap); render(); }, onErr);
    });
    db.collection("settings").doc("main").onSnapshot((snap) => {
      S.settings = Object.assign(JSON.parse(JSON.stringify(DEF)), snap.exists ? snap.data() : {}, { id: "main" });
      S.settings.open = Object.assign({}, DEF.open, S.settings.open || {});
      mark(snap); render();
    }, onErr);
  }

  // ---------------- math ----------------
  function rate() {
    if (num(S.settings.usdRate) > 0) return num(S.settings.usdRate);
    const ex = S.entries.filter((e) => e.t === "transfer" && e.to === "bybit" && ACCTS[e.from] && ACCTS[e.from].cur === "DZD" && num(e.amountTo) > 0)
      .sort((a, b) => (b.date + b.ts).localeCompare(a.date + a.ts))[0];
    return ex ? num(ex.amount) / num(ex.amountTo) : 0;
  }
  const prodById = (id) => S.products.find((p) => p.id === id);
  const campById = (id) => S.campaigns.find((c) => c.id === id);

  function balances() {
    const b = {}; Object.keys(ACCTS).forEach((k) => (b[k] = num(S.settings.open && S.settings.open[k])));
    const owedToMe = {}, iOwe = {};
    const add = (a, v) => { if (a in b) b[a] += v; };
    const bump = (o, p, v) => { o[p] = (o[p] || 0) + v; };
    S.entries.forEach((e) => {
      switch (e.t) {
        case "expense": add(e.acct, -num(e.amount)); break;
        case "income": add(e.acct, num(e.amount)); break;
        case "transfer": add(e.from, -num(e.amount)); add(e.to, num(e.amountTo) > 0 ? num(e.amountTo) : num(e.amount)); break;
        case "stock": add(e.acct, -num(e.qty) * num(e.unitCost)); break;
        case "ad": add("bybit", -num(e.usd)); break;
        case "results": add("delivery", num(e.delivered) * num(e.unit) - num(e.returned) * num(e.fee)); break;
        case "debt": {
          const a = num(e.amount), p = (e.person || "؟").trim();
          if (e.dir === "they") { if (e.kind === "new") { bump(owedToMe, p, a); add(e.acct, -a); } else { bump(owedToMe, p, -a); add(e.acct, a); } }
          else { if (e.kind === "new") { bump(iOwe, p, a); add(e.acct, a); } else { bump(iOwe, p, -a); add(e.acct, -a); } }
          break;
        }
      }
    });
    return { b, owedToMe, iOwe };
  }

  function avgCost(p) {
    const st = S.entries.filter((e) => e.t === "stock" && e.product === p.id);
    const q = st.reduce((a, e) => a + num(e.qty), 0);
    return q > 0 ? st.reduce((a, e) => a + num(e.qty) * num(e.unitCost), 0) / q : num(p.cost);
  }
  function stats(filter, p) {
    const es = S.entries.filter(filter);
    const r = rate();
    const s = { adUsd: 0, adDzd: 0, orders: 0, delivered: 0, returned: 0, revenue: 0, returnCost: 0, extra: 0, bought: 0 };
    es.forEach((e) => {
      if (e.t === "ad") { s.adUsd += num(e.usd); s.adDzd += num(e.usd) * (num(e.rate) || r); }
      if (e.t === "results") { s.orders += num(e.orders); s.delivered += num(e.delivered); s.returned += num(e.returned); s.revenue += num(e.delivered) * num(e.unit); s.returnCost += num(e.returned) * num(e.fee); }
      if (e.t === "expense") s.extra += num(e.amount);
      if (e.t === "stock") s.bought += num(e.qty);
    });
    const ac = p ? avgCost(p) : 0;
    s.cogs = s.delivered * ac;
    s.profit = s.revenue - s.cogs - s.adDzd - s.returnCost - s.extra;
    s.cpd = s.delivered > 0 ? s.adDzd / s.delivered : null;
    s.maxAd = p ? num(p.price) - ac : 0;
    s.rateD = s.orders > 0 ? s.delivered / s.orders : null;
    s.avgCost = ac;
    return s;
  }
  function productStats(p) {
    const s = stats((e) => e.product === p.id, p);
    s.stock = s.bought - s.delivered;
    s.stockValue = Math.max(0, s.stock) * s.avgCost;
    s.camps = S.campaigns.filter((c) => c.product === p.id).length;
    return s;
  }
  function verdict(s, hasData) {
    if (!hasData) return { c: "none", t: "لا توجد أرقام بعد" };
    if (s.maxAd <= 0) return { c: "bad", t: "يخسر حتى قبل الإعلانات" };
    if (s.profit >= 0) return { c: "good", t: "يربح" };
    if (s.cpd !== null && s.cpd > s.maxAd) return { c: "bad", t: "الإعلان أغلى من الربح. أوقفه أو غيّر شيئاً" };
    return { c: "warn", t: "يخسر حتى الآن. راقبه" };
  }

  function weekStart(d) { const x = new Date(d + "T12:00:00"); const diff = (x.getDay() - 6 + 7) % 7; x.setDate(x.getDate() - diff); return x.toLocaleDateString("en-CA"); }

  // ---------------- descriptions ----------------
  const pname = (id) => (prodById(id) && prodById(id).name) || "منتج";
  const aname = (k) => (ACCTS[k] && ACCTS[k].n) || (k === "none" ? "بدون مال" : "؟");
  function describe(e) {
    switch (e.t) {
      case "expense": return { t: (CATS[e.cat] ? CATS[e.cat].n : "مصروف") + (e.note ? " · " + e.note : ""), m: "من " + aname(e.acct) + (e.product ? " · " + pname(e.product) : ""), a: "−" + fmt(num(e.amount)) };
      case "income": return { t: "دخل" + (e.note ? " · " + e.note : ""), m: "إلى " + aname(e.acct), a: "+" + fmt(num(e.amount)) };
      case "transfer": {
        const fc = ACCTS[e.from] ? ACCTS[e.from].cur : "DZD", tc = ACCTS[e.to] ? ACCTS[e.to].cur : "DZD";
        const a = fc === "USD" ? usd(num(e.amount)) : fmt(num(e.amount));
        const b = num(e.amountTo) > 0 ? (tc === "USD" ? usd(num(e.amountTo)) : fmt(num(e.amountTo))) : "";

    const per = el("p", "", left > 0 ? "يعني حوالي " + fmt(left / daysLeft) + " في اليوم لـ " + daysLeft + " أيام. صرفت اليوم " + fmt(todaySpent) + "." : "حاول ألا تصرف شيئاً غير ضروري حتى السبت.");
    const chips = el("div", "chips");
    Object.keys(CATS).filter((k) => CATS[k].living).forEach((k) => {
      const v = living.filter((e) => e.cat === k).reduce((a, e) => a + num(e.amount), 0);
      if (v) chips.append(el("span", "chip", CATS[k].n + " " + Math.round(v).toLocaleString("en-US")));
    });
    box.append(head, big, lbl, bar, per); if (chips.childNodes.length) box.append(chips);
  }

  function renderCheckin() {
    const box = $("checkin"); box.replaceChildren();
    let dismissed = false; try { dismissed = localStorage.getItem("checkin") === today(); } catch (e) {}
    const active = S.campaigns.filter((c) => c.status !== "stopped");
    if (!dismissed) {
      box.append(el("h2", "", "هل أطلقت حملة جديدة اليوم؟"));
      const r = el("div", "row");
      const y = el("button", "", "نعم"); y.type = "button"; y.onclick = () => openSheet("campaign_new");
      const n = el("button", "plain", "لا"); n.type = "button"; n.onclick = () => { try { localStorage.setItem("checkin", today()); } catch (e) {} renderCheckin(); };
      r.append(y, n); box.append(r);
    }
    if (active.length) {
      box.append(el("h3", "", "أرقام اليوم للحملات النشطة"));
      active.forEach((c) => {
        const r = el("div", "li");
        const has = S.entries.some((e) => e.campaign === c.id && e.date === today());
        const d = el("div", "d"); d.append(el("span", "t", c.name), el("span", "m", pname(c.product) + (has ? " · سجّلت اليوم" : " · لم تسجّل اليوم")));
        const btns = el("div", "row");
        const a = el("button", "plain", "إعلانات"); a.type = "button"; a.onclick = () => openSheet("ad", { campaign: c.id });
        const b = el("button", "plain", "نتائج"); b.type = "button"; b.onclick = () => openSheet("results", { campaign: c.id });
        btns.append(a, b); r.append(d, btns); box.append(r);
      });
    } else if (dismissed) box.append(el("p", "empty", "لا توجد حملات نشطة."));
  }

  function renderToday() {
    renderWeek(); renderCheckin();
    $("todayDate").textContent = today();
    const l = $("todayList"); l.replaceChildren();
    const es = S.entries.filter((e) => e.date === today()).sort((a, b) => (b.ts || "").localeCompare(a.ts || ""));
    if (!es.length) l.append(el("p", "empty", "لا شيء مسجّل اليوم بعد. اكتب أول مصروف في الأعلى."));
    es.forEach((e) => l.append(liRow(e, () => del("entries", e.id))));
  }

  function tile(label, value, cls) { const t = el("div", "tile"); t.append(el("span", "l", label)); const v = el("span", "v", value); if (cls) v.style.color = "var(--" + cls + ")"; t.append(v); return t; }

  function renderStore() {
    const tiles = $("storeTiles"); tiles.replaceChildren();
    const month = today().slice(0, 7);
    const ms = stats((e) => (e.date || "").slice(0, 7) === month && (e.t === "ad" || e.t === "results" || (e.t === "expense" && CATS[e.cat] && !CATS[e.cat].living)));
    // cogs needs per-product cost: sum per product for this month
    let cogs = 0; S.products.forEach((p) => { const s = stats((e) => e.product === p.id && (e.date || "").slice(0, 7) === month, p); cogs += s.cogs; });
    const monthProfit = ms.revenue - cogs - ms.adDzd - ms.returnCost - ms.extra;
    let stockVal = 0; S.products.forEach((p) => (stockVal += productStats(p).stockValue));
    tiles.append(tile("ربح المتجر هذا الشهر", fmt(monthProfit), monthProfit >= 0 ? "good" : "bad"), tile("إعلانات هذا الشهر", usd(ms.adUsd)), tile("قيمة الستوك", fmt(stockVal)), tile("سعر الدولار", rate() ? Math.round(rate()) + " دج" : "—"));

    const cat = $("catalog"); cat.replaceChildren();
    if (!S.products.length) cat.append(el("p", "empty", "لا توجد منتجات بعد. أضف منتجك الرئيسي بزر \"+ منتج\"."));
    S.products.forEach((p) => {
      const s = productStats(p); const v = verdict(s, s.adUsd > 0 || s.orders > 0 || s.delivered > 0);
      const c = el("div", "card");
      const h = el("div", "row between"); h.append(el("h3", "", p.name), el("span", "pill " + v.c, v.t)); c.append(h);
      const dl = el("dl", "kv");
      const rows = [
        ["الستوك", Math.round(s.stock) + " قطعة"], ["قيمة الستوك", fmt(s.stockValue)],
        ["تستلم لكل طلبية", fmt(num(p.price))], ["تكلفة القطعة", fmt(s.avgCost)],
        ["أقصى إعلان لكل مُسلَّمة", fmt(Math.max(0, s.maxAd))],
        ["الإعلانات", usd(s.adUsd) + " ≈ " + fmt(s.adDzd)],
        ["طلبيات ← مُسلَّمة ← مرتجعة", s.orders + " → " + s.delivered + " → " + s.returned + (s.rateD !== null ? " (" + Math.round(s.rateD * 100) + "%)" : "")],
        ["تكلفة الإعلان لكل مُسلَّمة", s.cpd !== null ? fmt(s.cpd) : "–"],
        ["المداخيل", fmt(s.revenue)], ["الحملات", String(s.camps)],
        ["الربح أو الخسارة", fmt(s.profit), true]
      ];
      rows.forEach(([k, val, tot]) => { const dt = el("dt", tot ? "tot" : "", k); const dd = el("dd", tot ? "tot" : "", val); dl.append(dt, dd); });
      c.append(dl);
      if (s.stock <= 3 && s.bought > 0) c.append(el("p", "pill warn", "الستوك قليل: " + Math.round(s.stock) + " قطعة"));
      const r = el("div", "row");
      [["شراء ستوك", "stock"], ["حملة", "campaign_new"]].forEach(([t, f]) => { const b = el("button", "plain", t); b.type = "button"; b.onclick = () => openSheet(f, { product: p.id }); r.append(b); });
      const ed = el("button", "ghost", "تعديل"); ed.type = "button"; ed.onclick = () => openSheet("product_new", { id: p.id, name: p.name, price: p.price, cost: p.cost }); r.append(ed);
      c.append(r);
      cat.append(c);
    });
  }

  function renderCamps() {
    const box = $("campList"); box.replaceChildren();
    if (!S.campaigns.length) { box.append(el("p", "empty", "لا توجد حملات بعد. عندما تطلق حملة، أضفها هنا لتعرف إن كانت تربح.")); return; }
    const sorted = [...S.campaigns].sort((a, b) => ((a.status === "stopped") - (b.status === "stopped")) || (b.start || "").localeCompare(a.start || ""));
    sorted.forEach((cp) => {
      const p = prodById(cp.product); const s = stats((e) => e.campaign === cp.id, p);
      const v = verdict(s, s.adUsd > 0 || s.orders > 0);
      const c = el("div", "card");
      const h = el("div", "row between");
      const t = el("div", "d"); t.style.display = "grid"; t.append(el("h3", "", cp.name), el("span", "sub", pname(cp.product) + " · من " + (cp.start || "") + (cp.status === "stopped" ? " · متوقفة" : "")));
      h.append(t, el("span", "pill " + v.c, v.t)); c.append(h);
      if (num(cp.budgetUsd) > 0) {
        const bar = el("div", "bar" + (s.adUsd > num(cp.budgetUsd) ? " over" : "")); const f = el("i"); f.style.width = Math.min(100, (s.adUsd / num(cp.budgetUsd)) * 100) + "%"; bar.append(f);
        c.append(el("p", "sub", "صرفت " + usd(s.adUsd) + " من ميزانية " + usd(num(cp.budgetUsd))), bar);
        if (s.adUsd >= num(cp.budgetUsd) && s.profit < 0) c.append(el("p", "pill bad", "انتهت ميزانية التجربة وما زالت تخسر. القاعدة: أوقفها."));
      }
      const dl = el("dl", "kv");
      [["الإعلانات", usd(s.adUsd) + " ≈ " + fmt(s.adDzd)], ["طلبيات ← مُسلَّمة ← مرتجعة", s.orders + " → " + s.delivered + " → " + s.returned],
       ["تكلفة الإعلان لكل مُسلَّمة", s.cpd !== null ? fmt(s.cpd) : "–"], ["الحد الأقصى المسموح", fmt(Math.max(0, s.maxAd))],
       ["الربح أو الخسارة", fmt(s.profit), true]].forEach(([k, val, tot]) => dl.append(el("dt", tot ? "tot" : "", k), el("dd", tot ? "tot" : "", val)));
      c.append(dl);
      const r = el("div", "row");
      if (cp.status !== "stopped") {
        const a = el("button", "plain", "إعلانات"); a.type = "button"; a.onclick = () => openSheet("ad", { campaign: cp.id });
        const b = el("button", "plain", "نتائج"); b.type = "button"; b.onclick = () => openSheet("results", { campaign: cp.id });
        r.append(a, b);
      }
      const st = el("button", "ghost", cp.status === "stopped" ? "أعد تشغيلها" : "أوقف الحملة"); st.type = "button";
      st.onclick = () => put("campaigns", Object.assign({}, cp, { status: cp.status === "stopped" ? "active" : "stopped" }));
      r.append(st); c.append(r);
      box.append(c);
    });
  }

  function renderMoney() {
    const { b, owedToMe, iOwe } = balances(); const r = rate();
    const dzdTotal = b.cash + b.ccp + b.delivery + b.bybit * r;
    const owedSum = Object.values(owedToMe).reduce((a, v) => a + Math.max(0, v), 0);
    const oweSum = Object.values(iOwe).reduce((a, v) => a + Math.max(0, v), 0);
    let stockVal = 0; S.products.forEach((p) => (stockVal += productStats(p).stockValue));
    const net = $("netCard"); net.replaceChildren();
    net.append(el("h2", "", "كل ما تملكه"), el("div", "big", fmt(dzdTotal + owedSum - oweSum + stockVal)));
    const dl = el("dl", "kv");
    [["المال في كل المصادر", fmt(dzdTotal)], ["ديون لك عند الناس", "+" + fmt(owedSum)], ["قيمة الستوك", "+" + fmt(stockVal)], ["ديون عليك", "−" + fmt(oweSum)]]
      .forEach(([k, v]) => dl.append(el("dt", "", k), el("dd", "", v)));
    net.append(dl);
    if (!r) net.append(el("p", "pill warn", "حدّد سعر الدولار في الإعدادات ليُحسب Bybit بالدينار."));

    const al = $("acctList"); al.replaceChildren();
    Object.keys(ACCTS).forEach((k) => {
      const row = el("div", "li"); const d = el("div", "d"); d.append(el("span", "t", ACCTS[k].n));
      if (k === "bybit" && r) d.append(el("span", "m", "≈ " + fmt(b[k] * r)));
      if (k === "delivery") d.append(el("span", "m", "مال الطلبيات المُسلَّمة الذي لم يصلك بعد"));
      const a = el("span", "a", ACCTS[k].cur === "USD" ? usd(b[k]) : fmt(b[k])); if (b[k] < 0) a.style.color = "var(--bad)";
      row.append(d, a); al.append(row);
    });
    const tr = el("div", "row"); tr.style.paddingTop = "8px";
    const t1 = el("button", "plain", "تحويل / شراء دولار"); t1.type = "button"; t1.onclick = () => openSheet("transfer");
    const t2 = el("button", "plain", "استلمت من شركة التوصيل"); t2.type = "button"; t2.onclick = () => openSheet("transfer", { from: "delivery", to: "ccp" });
    tr.append(t1, t2); al.append(tr);

    const db_ = $("debtBox"); db_.replaceChildren();
    const sec = (title, obj, dir) => {
      const w = el("div", "stack"); w.append(el("h3", "", title));
      const names = Object.keys(obj).filter((p) => Math.abs(obj[p]) > 0.5);
      if (!names.length) w.append(el("p", "empty", "لا شيء."));
      const l = el("div", "list");
      names.forEach((p) => {
        const row = el("div", "li"); row.append(el("span", "t", p));
        const rr = el("div", "row"); rr.append(el("span", "a", fmt(obj[p])));
        const b2 = el("button", "plain", "تسديد"); b2.type = "button"; b2.onclick = () => openSheet("debt", { person: p, dir, kind: "pay", amount: Math.round(obj[p]) });
        rr.append(b2); row.append(rr); l.append(row);
      });
      w.append(l); return w;
    };
    db_.append(sec("الناس المدينون لك", owedToMe, "they"), sec("أنت مدين لـ", iOwe, "me"));
    const nb = el("button", "ghost", "+ دين جديد"); nb.type = "button"; nb.onclick = () => openSheet("debt"); db_.append(nb);

    const all = $("allList"); all.replaceChildren();
    const es = [...S.entries].sort((a, b) => (b.date + (b.ts || "")).localeCompare(a.date + (a.ts || "")));
    if (!es.length) all.append(el("p", "empty", "لا توجد عمليات بعد."));
    es.slice(0, 60).forEach((e) => all.append(liRow(e, () => del("entries", e.id))));
    if (es.length > 60) all.append(el("p", "sub", "تظهر آخر 60 عملية من " + es.length + "."));

    // settings inputs: only fill when not focused, so typing isn't interrupted by live updates
    const set = (id, v) => { const i = $(id); if (document.activeElement !== i) i.value = v || ""; };
    set("s-weekly", S.settings.weekly); set("s-rate", S.settings.usdRate); set("s-ret", S.settings.returnFee);
    const og = $("openGrid");
    if (!og.childNodes.length) Object.keys(ACCTS).forEach((k) => { const l = el("label", "f", ACCTS[k].n + (ACCTS[k].cur === "USD" ? " ($)" : " (دج)")); const i = el("input"); i.type = "number"; i.step = "any"; i.id = "s-open-" + k; l.append(i); og.append(l); });
    Object.keys(ACCTS).forEach((k) => set("s-open-" + k, S.settings.open ? S.settings.open[k] : 0));
  }

  // ---------------- routing ----------------
  const VIEWS = { today: "v-today", store: "v-store", campaigns: "v-camps", money: "v-money" };
  function route() {
    const h = (location.hash || "#today").slice(1); const key = VIEWS[h] ? h : "today";
    Object.entries(VIEWS).forEach(([k, id]) => ($(id).hidden = k !== key));
    document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === "#" + key ? "page" : "false"));
  }
  window.addEventListener("hashchange", route);

  function render() { renderToday(); renderStore(); renderCamps(); renderMoney(); }

  // ---------------- wire up ----------------
  EXAMPLES.forEach((x) => { const b = el("button", "chip", x); b.type = "button"; b.onclick = () => { const t = $("smartText"); t.value = (t.value ? t.value + "، " : "") + x; t.focus(); }; $("smartEx").append(b); });
  $("smartGo").onclick = smartGo;
  [["مصروف", "expense"], ["إعلانات", "ad"], ["نتائج", "results"], ["ستوك", "stock"], ["شراء دولار", "transfer"], ["دين", "debt"], ["دخل", "income"], ["حملة", "campaign_new"]]
    .forEach(([t, f]) => { const b = el("button", "", t); b.type = "button"; b.onclick = () => openSheet(f, f === "transfer" ? { from: "ccp", to: "bybit" } : null); $("quick").append(b); });
  $("addProduct").onclick = () => openSheet("product_new");
  $("addCampaign").onclick = () => openSheet("campaign_new");
  $("saveSettings").onclick = () => {
    const s = Object.assign({}, S.settings, { id: "main", weekly: num($("s-weekly").value), usdRate: num($("s-rate").value), returnFee: num($("s-ret").value), open: {} });
    Object.keys(ACCTS).forEach((k) => (s.open[k] = num($("s-open-" + k).value)));
    put("settings", s); $("setMsg").textContent = "تم الحفظ.";
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("sheetRoot").replaceChildren(); });

  route(); render(); renderSmartAvail(); initStore();
})();
</script>
